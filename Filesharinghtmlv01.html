<div style="text-align:center; padding:20px; font-family:sans-serif;">
    <div id="banner1"> [PASTE BANNER 1 CODE] </div>
    <h2 id="timer-text">Please wait: 20s</h2>
    <div id="banner2"> [PASTE BANNER 2 CODE] </div>
    <br>
    <a id="downloadBtn" href="#" style="display:none; padding:15px 30px; background:#0088cc; color:white; border-radius:10px; text-decoration:none;">✅ Get Files Now</a>
</div>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const mediaId = urlParams.get('id');
    const botDeepLink = `https://t.me/filesharingv1_bot?start=get_${mediaId}`;

    const btn = document.getElementById('downloadBtn');
    btn.href = botDeepLink;

    btn.addEventListener('click', function (e) {
        e.preventDefault();
        if (tg && tg.openTelegramLink) {
            // Properly hands off to the bot chat and closes the WebApp
            tg.openTelegramLink(botDeepLink);
            tg.close();
        } else {
            // Fallback for non-Telegram browsers
            window.location.href = botDeepLink;
        }
    });

    let timeLeft = 20;
    const timerDisplay = document.getElementById('timer-text');
    const countdown = setInterval(() => {
        timeLeft--;
        timerDisplay.innerHTML = `Please wait: ${timeLeft}s`;
        if (timeLeft <= 0) {
            clearInterval(countdown);
            timerDisplay.style.display = 'none';
            btn.style.display = 'inline-block';
        }
    }, 1000);
</script>
